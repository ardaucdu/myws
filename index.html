<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://raw.githubusercontent.com data:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com;">
    <title>IIIIIIIIIIIIIIIIII</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"
            integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"
            integrity="sha384-qSFej5dZNviyoPgYJ5+Xk4bEbX8AYddxAHPuzs1aSgRiXxJ3qmyWNaPsRkpv/+x5"
            crossorigin="anonymous"></script>
</head>
<body>
    <div id="dark-overlay"></div>
    <div id="preloader">
        <div class="static-noise"></div>
        <img src="images/123.gif" alt="Yükleniyor...">
    </div>
    <div id="main-content" class="hidden">
        <div class="kali-terminal-frame shrink" id="draggable-terminal">
            <div class="kali-terminal-topbar" id="terminal-topbar" >
                <span class="kali-terminal-title" >root@ardaucdu: ~</span>
                <span class="kali-terminal-close"></span>
            </div>
            <div class="kali-terminal-content" id="terminal-content" >

                <div class="kali-prompt">
                    <span class="kali-root">root</span><span class="kali-at">@</span><span class="kali-host">ardaucdu</span><span class="kali-path">:~#</span> ls -la /blogs
                </div>
                <pre class="kali-blog-desc" id="blog-list-container" >Yükleniyor... (Bloglar aranıyor)</pre>
                <div class="kali-prompt">
                    <span class="kali-root">root</span><span class="kali-at">@</span><span class="kali-host">ardaucdu</span><span class="kali-path">:~#</span> <span id="arda-komut"></span><span class="kali-cursor"></span>
                </div>
            </div>
        </div>
    </div>
    <div id="blog-modal" class="hidden">
        <div class="modal-bg-container">
            <img src="images/logoll.png" alt="" class="modal-bg-logo">
        </div>
        
        <div class="modal-header">
            <span id="blog-modal-title">blog-yazisi.md</span>
            <span id="blog-modal-close">[x]</span>
        </div>
        <div id="blog-content" class="markdown-body"></div>
    </div>
        </div>
    </div>
    <div class="footer-text">hakları saklı değildir kodlara githubdan ulaşabilirsiniz .d</div>
    <script src="main.js"></script>
</body>
</html>
