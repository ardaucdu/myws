<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://raw.githubusercontent.com data:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com;">
    <title>IIIIIIIIIIIIIIIIII</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"
            integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"
            integrity="sha384-qSFej5dZNviyoPgYJ5+Xk4bEbX8AYddxAHPuzs1aSgRiXxJ3qmyWNaPsRkpv/+x5"
            crossorigin="anonymous"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
        }
        body {
            background: #070c12 url('images/arkaplan.png') no-repeat center center fixed;
            background-size: cover;
            cursor: url('images/my-cursor.cur'), auto;
            min-height: 100vh;
            width: 100vw;
            position: relative;
        }
        .kali-terminal-frame {
            box-shadow: 0 8px 32px 0 #000a;
            overflow: hidden;
            background: rgba(10, 22, 34, 0.25);
            transition: all 0.3s ease-in-out;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            border-radius: 0;
            z-index: 9999;
        }
        .kali-terminal-frame.shrink {
            max-width: 1100px;
            margin: 60px auto 40px auto;
            border-radius: 10px;
            min-height: 462px;
            max-height: 90vh;
            width: auto;
            height: auto;
            position: relative;
            inset: auto;
            z-index: 1;
        }
        .kali-terminal-menubar {
            background: #232b36;
            height: 28px;
            display: flex;
            align-items: center;
            padding-left: 18px;
            font-family: 'Fira Mono', 'Consolas', monospace;
            font-size: 15px;
            color: #b8c7ce;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            user-select: none;
        }
        .kali-terminal-topbar {
            background: #232b36;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid #232b36;
        }
        .kali-terminal-title {
            color: #b8c7ce;
            font-family: 'Fira Mono', 'Consolas', monospace;
            font-size: 15px;
            opacity: 0.92;
            letter-spacing: 0.5px;
            text-align: center;
            flex: 1;
        }
        .kali-terminal-close {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px; height: 16px;
            border-radius: 50%;
            background: #3daee9;
            border: 1.5px solid #1b6ca8;
            box-shadow: 0 0 4px #3daee9aa;
            cursor: pointer;
        }
        .kali-terminal-content {
            background: none;
            padding: 2.5em 2.5em 2em 2.5em;
            font-family: 'Fira Mono', 'Consolas', 'monospace';
            color: #b8c7ce;
            font-size: 18px;
            height: calc(100vh - 36px);
            box-sizing: border-box;
        }
        .kali-prompt { color: #6ec1e4; }
        .kali-root { color: #ff5555; font-weight: bold; }
        .kali-at { color: #b8c7ce; }
        .kali-host { color: #3daee9; }
        .kali-path { color: #b8c7ce; }
        .kali-hash { color: #ff5555; font-weight: bold; }
        .kali-cursor {
            display: inline-block;
            width: 16px;
            height: 22px;
            background: #fff;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 1s steps(1) infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .kali-blog-title { color: #3daee9; text-decoration: none; font-weight: bold; }
        .kali-blog-desc { color: #7a8fa6; font-size: 15px; margin-left: 2em; }
        .markdown-body {
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            color: #e0e0e0;
            line-height: 1.6;
            font-size: 16px;
            text-shadow: none;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: #ffffff;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            font-weight: bold;
            text-transform: none;
            letter-spacing: 0;
            text-shadow: none;
        }
        .markdown-body h1 { font-size: 1.8em; border-bottom: 2px solid #ffffff; padding-bottom: 0.3em; }
        .markdown-body h2 { font-size: 1.4em; border-bottom: 1px solid #888888; padding-bottom: 0.3em; color: #e0e0e0; }
        .markdown-body h3 { font-size: 1.2em; color: #cccccc; }
        .markdown-body a { color: #ffffff; text-decoration: underline; }
        .markdown-body a:hover { color: #000000; background: #ffffff; text-decoration: none; }
        .markdown-body img { max-width: 100%; border: 1px solid #ffffff; padding: 2px; background: #000000; margin: 1em 0; display: block; position:relative; z-index:2; filter: grayscale(100%); transition: all 0.3s; }
        .markdown-body img:hover { filter: grayscale(0%); }
        .markdown-body code { background: #222222; border: 1px solid #555555; padding: 0.1em 0.3em; color: #ffffff; font-family: inherit; }
        .markdown-body pre { background: #000000; padding: 1em; overflow-x: auto; border: 1px solid #ffffff; position:relative; z-index:2; }
        .markdown-body pre code { background: transparent; padding: 0; color: #ffffff; border: none; }
        .markdown-body blockquote { background: #111111; border: 1px solid #555555; border-left: 3px solid #ffffff; margin: 1em 0; padding: 1em; color: #cccccc; font-style: normal; }
        .markdown-body ul, .markdown-body ol { padding-left: 2em; }
        .markdown-body li::marker { color: #ffffff; }
        .markdown-body hr { border: none; border-bottom: 1px dashed #888888; margin: 2em 0; }
        @media (max-width: 900px) {
            .kali-terminal-frame { max-width: 99vw; }
            .kali-terminal-content { padding: 1em 0.5em; font-size: 15px; }
        }
        @keyframes epilepsy-bg {
            0% { 
                background: #000;
                filter: contrast(1.2) brightness(0.8);
            }
            5% { 
                background: #1a0f0f;
                filter: contrast(1.4) brightness(0.9) hue-rotate(5deg);
            }
            10% { 
                background: #0f1a0f;
                filter: contrast(1.6) brightness(1) hue-rotate(-5deg);
            }
            15% { 
                background: #0f0f1a;
                filter: contrast(1.8) brightness(1.1) hue-rotate(10deg);
            }
            20% { 
                background: #1a1a0f;
                filter: contrast(2) brightness(1.2) hue-rotate(-10deg);
            }
            25% { 
                background: #1a0f1a;
                filter: contrast(2.2) brightness(1.3) hue-rotate(15deg);
            }
            30% { 
                background: #0f1a1a;
                filter: contrast(2.4) brightness(1.4) hue-rotate(-15deg);
            }
            35% { 
                background: #1a1a1a;
                filter: contrast(2.6) brightness(1.5) hue-rotate(20deg);
            }
            40% { 
                background: #000;
                filter: contrast(2.8) brightness(1.6) hue-rotate(-20deg);
            }
            45% { 
                background: #1a0f0f;
                filter: contrast(3) brightness(1.7) hue-rotate(25deg);
            }
            50% { 
                background: #0f1a0f;
                filter: contrast(3.2) brightness(1.8) hue-rotate(-25deg);
            }
            55% { 
                background: #0f0f1a;
                filter: contrast(3.4) brightness(1.9) hue-rotate(30deg);
            }
            60% { 
                background: #1a1a0f;
                filter: contrast(3.6) brightness(2) hue-rotate(-30deg);
            }
            65% { 
                background: #1a0f1a;
                filter: contrast(3.8) brightness(2.1) hue-rotate(35deg);
            }
            70% { 
                background: #0f1a1a;
                filter: contrast(4) brightness(2.2) hue-rotate(-35deg);
            }
            75% { 
                background: #1a1a1a;
                filter: contrast(4.2) brightness(2.3) hue-rotate(40deg);
            }
            80% { 
                background: #000;
                filter: contrast(4.4) brightness(2.4) hue-rotate(-40deg);
            }
            85% { 
                background: #1a0f0f;
                filter: contrast(4.6) brightness(2.5) hue-rotate(45deg);
            }
            90% { 
                background: #0f1a0f;
                filter: contrast(4.8) brightness(2.6) hue-rotate(-45deg);
            }
            95% { 
                background: #0f0f1a;
                filter: contrast(5) brightness(2.7) hue-rotate(50deg);
            }
            100% { 
                background: #000;
                filter: contrast(5.2) brightness(2.8) hue-rotate(-50deg);
            }
        }
        @keyframes runRight {
            0% {
                left: 0%;
                top: 50%;
                transform: translateY(0) scaleX(1);
            }
            10% {
                transform: translateY(-12px) scaleX(1.08);
            }
            20% {
                left: 20%;
                transform: translateY(0) scaleX(1);
            }
            30% {
                transform: translateY(-16px) scaleX(1.12);
            }
            40% {
                left: 40%;
                transform: translateY(0) scaleX(1);
            }
            50% {
                transform: translateY(-12px) scaleX(1.08);
            }
            60% {
                left: 60%;
                transform: translateY(0) scaleX(1);
            }
            70% {
                transform: translateY(-8px) scaleX(1.04);
            }
            80% {
                left: 80%;
                transform: translateY(0) scaleX(1);
            }
            90% {
                transform: translateY(-4px) scaleX(1.02);
            }
            100% {
                left: 100%;
                top: 50%;
                transform: translateY(0) scaleX(1);
            }
        }
        #preloader {
            position: fixed;
            z-index: 10000;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: epilepsy-bg 0.4s steps(1) infinite;
            overflow: hidden;
            transition: all 0.5s ease-in-out;
            background: #000;
        }
        #preloader::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.2),
                    rgba(0, 0, 0, 0.2) 1px,
                    transparent 1px,
                    transparent 2px
                ),
                repeating-linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.2),
                    rgba(0, 0, 0, 0.2) 1px,
                    transparent 1px,
                    transparent 2px
                );
            pointer-events: none;
            animation: scanline 0.1s linear infinite;
            mix-blend-mode: overlay;
        }
        #preloader::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(
                    circle at center,
                    transparent 0%,
                    rgba(0, 0, 0, 0.4) 100%
                ),
                repeating-conic-gradient(
                    from 0deg,
                    #000 0deg 10deg,
                    transparent 10deg 20deg
                );
            background-size: 100% 100%, 4px 4px;
            pointer-events: none;
            animation: noise 0.2s steps(4) infinite;
            mix-blend-mode: overlay;
            opacity: 0.7;
        }
        @keyframes noise {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-1px, 1px) rotate(0.5deg); }
            50% { transform: translate(1px, -1px) rotate(-0.5deg); }
            75% { transform: translate(-1px, -1px) rotate(0.5deg); }
            100% { transform: translate(1px, 1px) rotate(-0.5deg); }
        }
        @keyframes scanline {
            0% { transform: translateY(-100%) skewX(0deg); }
            50% { transform: translateY(0%) skewX(1deg); }
            100% { transform: translateY(100%) skewX(0deg); }
        }
        #preloader.shrink {
            transform: none;
            opacity: 0;
            border-radius: 0;
            background: #000;
        }
        #preloader .wheel-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 420px;
            height: 420px;
            transform: translate(-50%, -50%);
            z-index: 0;
            opacity: 0.18;
        }
        #preloader img {
            width: 640px;
            height: 640px;
            object-fit: contain;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.75);
            animation: pikachuStaticFade 3s linear forwards;
            transition: all 0.5s ease-in-out;
            z-index: 2;
            will-change: opacity, filter;
        }
        #preloader.shrink img {
            transform: none;
            opacity: 0;
        }
        body, #preloader, #preloader * {
            cursor: url('images/my-cursor.cur'), auto !important;
        }
        @keyframes hamsterWheel {
            0% {
                transform: rotate(0deg) translateX(200px) rotate(0deg) scaleX(1) scaleY(1);
            }
            10% {
                transform: rotate(36deg) translateX(200px) rotate(-36deg) scaleX(1.08) scaleY(0.95);
            }
            20% {
                transform: rotate(72deg) translateX(200px) rotate(-72deg) scaleX(1.12) scaleY(0.92);
            }
            30% {
                transform: rotate(108deg) translateX(200px) rotate(-108deg) scaleX(1.08) scaleY(0.95);
            }
            40% {
                transform: rotate(144deg) translateX(200px) rotate(-144deg) scaleX(1) scaleY(1);
            }
            50% {
                transform: rotate(180deg) translateX(200px) rotate(-180deg) scaleX(0.95) scaleY(1.08);
            }
            60% {
                transform: rotate(216deg) translateX(200px) rotate(-216deg) scaleX(0.92) scaleY(1.12);
            }
            70% {
                transform: rotate(252deg) translateX(200px) rotate(-252deg) scaleX(0.95) scaleY(1.08);
            }
            80% {
                transform: rotate(288deg) translateX(200px) rotate(-288deg) scaleX(1) scaleY(1);
            }
            90% {
                transform: rotate(324deg) translateX(200px) rotate(-324deg) scaleX(1.08) scaleY(0.95);
            }
            100% {
                transform: rotate(360deg) translateX(200px) rotate(-360deg) scaleX(1) scaleY(1);
            }
        }
        @keyframes pikachuStaticFade {
            0% { opacity: 1; filter: none; transform: translate(-50%, -50%) scale(0.75); }
            6.7% { opacity: 1; filter: none; transform: translate(-50%, -50%) scale(0.75); }
            86.7% { opacity: 0.5; filter: grayscale(1) blur(2px); transform: translate(-50%, -50%) scale(0.75); }
            100% { opacity: 0; filter: grayscale(1) blur(6px); transform: translate(-50%, -50%) scale(0.75); }
        }
        #preloader .pixel-scatter {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            animation: pixelScatter 1s ease-out forwards;
            animation-delay: 3s;
        }
        @keyframes pixelScatter {
            0% {
                opacity: 0;
                transform: scale(1);
                filter: blur(0);
            }
            5% {
                opacity: 1;
                transform: scale(1.2);
                filter: blur(2px);
            }
            100% {
                opacity: 0;
                transform: scale(3);
                filter: blur(30px);
            }
        }
        #preloader .pixel-scatter::before,
        #preloader .pixel-scatter::after,
        #preloader .pixel-scatter .particle3,
        #preloader .pixel-scatter .particle4 {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background-image: inherit;
            background-size: 640px 640px;
            image-rendering: pixelated;
            animation: scatterPixels 1s ease-out forwards;
            animation-delay: 3s;
        }
        #preloader .pixel-scatter::before { animation-name: scatterPixels1; }
        #preloader .pixel-scatter::after { animation-name: scatterPixels2; }
        #preloader .pixel-scatter .particle3 { animation-name: scatterPixels3; }
        #preloader .pixel-scatter .particle4 { animation-name: scatterPixels4; }
        @keyframes scatterPixels1 {
            0% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                filter: brightness(1) contrast(1) hue-rotate(0deg) saturate(1) blur(0);
                opacity: 0;
            }
            5% { opacity: 1; }
            100% {
                transform: translate(-200%, -200%) scale(0.3) rotate(1080deg) skew(60deg, 60deg);
                filter: brightness(3) contrast(3) hue-rotate(360deg) saturate(3) blur(15px) invert(1);
                opacity: 0;
            }
        }
        @keyframes scatterPixels2 {
            0% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                filter: brightness(1) contrast(1) hue-rotate(0deg) saturate(1) blur(0);
                opacity: 0;
            }
            5% { opacity: 1; }
            100% {
                transform: translate(200%, 200%) scale(0.3) rotate(-1080deg) skew(-60deg, -60deg);
                filter: brightness(3) contrast(3) hue-rotate(-360deg) saturate(3) blur(15px) invert(1);
                opacity: 0;
            }
        }
        @keyframes scatterPixels3 {
            0% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                filter: brightness(1) contrast(1) hue-rotate(0deg) saturate(1) blur(0);
                opacity: 0;
            }
            5% { opacity: 1; }
            100% {
                transform: translate(200%, -200%) scale(0.3) rotate(1080deg) skew(-60deg, 60deg);
                filter: brightness(3) contrast(3) hue-rotate(360deg) saturate(3) blur(15px) invert(1);
                opacity: 0;
            }
        }
        @keyframes scatterPixels4 {
            0% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                filter: brightness(1) contrast(1) hue-rotate(0deg) saturate(1) blur(0);
                opacity: 0;
            }
            5% { opacity: 1; }
            100% {
                transform: translate(-200%, 200%) scale(0.3) rotate(-1080deg) skew(60deg, -60deg);
                filter: brightness(3) contrast(3) hue-rotate(-360deg) saturate(3) blur(15px) invert(1);
                opacity: 0;
            }
        }
        #preloader .glitch-overlay {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent 0%,
                rgba(255, 0, 0, 0.1) 0.5%,
                transparent 1%
            );
            animation: glitch 0.3s steps(2) infinite;
            pointer-events: none;
            mix-blend-mode: overlay;
        }
        @keyframes glitch {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            50% { transform: translateX(2px); }
            75% { transform: translateX(-1px); }
            100% { transform: translateX(1px); }
        }
        #preloader .static-noise {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 640px;
            height: 640px;
            transform: translate(-50%, -50%) scale(0.75);
            background: url('images/static.png') center center/cover no-repeat;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            animation: staticAppear 2.4s linear forwards;
            animation-delay: 0.2s;
        }
        @keyframes staticAppear {
            0% { opacity: 0; }
            80% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        @keyframes threat-glow {
            0% { box-shadow: 0 0 24px #000a, 0 0 8px #ff0000; color: #ff5555; }
            100% { box-shadow: 0 0 48px #ff0000, 0 0 16px #fff; color: #fff; }
        }
        .threat-wait-text {
            position: absolute;
            top: 82%;
            left: 50%;
            transform: translate(-50%, 0);
            color: #e0e0e0;
            font-family: 'IM Fell English SC', serif;
            font-size: 2.7em;
            text-shadow: 0 0 8px #000, 0 0 2px #a00, 0 2px 12px #000;
            letter-spacing: 0.18em;
            background: rgba(10,10,10,0.82);
            padding: 0.45em 1.2em 0.35em 1.2em;
            border-radius: 8px;
            z-index: 20;
            border: 1.5px solid #222;
            box-shadow: 0 0 24px #000a, 0 0 8px #0008;
            animation: horror-flicker 2.2s infinite alternate, horror-fade 4.2s infinite alternate;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.22em;
        }
        .threat-wait-text span {
            font-weight: 400;
            display: inline-block;
            filter: blur(0.2px);
            letter-spacing: 0.22em;
        }
        @keyframes horror-flicker {
            0% { opacity: 0.92; filter: blur(0.2px); }
            10% { opacity: 0.7; filter: blur(0.5px); }
            20% { opacity: 0.95; filter: blur(0.1px); }
            30% { opacity: 0.8; filter: blur(0.3px); }
            40% { opacity: 1; filter: blur(0.2px); }
            50% { opacity: 0.6; filter: blur(0.7px); }
            60% { opacity: 0.95; filter: blur(0.1px); }
            70% { opacity: 0.8; filter: blur(0.3px); }
            80% { opacity: 1; filter: blur(0.2px); }
            90% { opacity: 0.7; filter: blur(0.5px); }
            100% { opacity: 0.92; filter: blur(0.2px); }
        }
        @keyframes horror-fade {
            0% { color: #e0e0e0; }
            50% { color: #a00; }
            100% { color: #e0e0e0; }
        }
    </style>
</head>
<body>
    <div id="dark-overlay"></div>
    <div id="preloader">
        <div class="static-noise"></div>
        <img src="images/123.gif" alt="Yükleniyor...">
    </div>
    <div id="main-content" style="display:none;">
        <div class="kali-terminal-frame shrink" id="draggable-terminal">
            <div class="kali-terminal-topbar" id="terminal-topbar" style="height:32px;display:flex;align-items:center;justify-content:center;background:#232b36;border-bottom:1px solid #232b36;">
                <span class="kali-terminal-title" style="color:#b8c7ce;font-family:'Fira Mono','Consolas',monospace;font-size:15px;opacity:0.92;letter-spacing:0.5px;text-align:center;">root@ardaucdu: ~</span>
                <span class="kali-terminal-close"></span>
            </div>
            <div class="kali-terminal-content" id="terminal-content" style="overflow-y:auto; overflow-x:hidden;">

                <div class="kali-prompt">
                    <span class="kali-root">root</span><span class="kali-at">@</span><span class="kali-host">ardaucdu</span><span class="kali-path">:~#</span> ls -la /blogs
                </div>
                <pre class="kali-blog-desc" id="blog-list-container" style="font-size:18px; margin-left:2em; color:#b8c7ce; background:none; border:none;">Yükleniyor... (Bloglar aranıyor)</pre>
                <div class="kali-prompt">
                    <span class="kali-root">root</span><span class="kali-at">@</span><span class="kali-host">ardaucdu</span><span class="kali-path">:~#</span> <span id="arda-komut" style="color:#b8c7ce;"></span><span class="kali-cursor"></span>
                </div>
            </div>
        </div>
    </div>
    <div id="blog-modal" style="display:none; position:fixed; inset:0; background-color:#000000; z-index:99999; flex-direction:column; padding:0;">
        <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:1;">
            <img src="images/logoll.png" alt="" style="max-width:40%; max-height:50%; opacity:0.275; filter:grayscale(100%); pointer-events:none; user-select:none;">
        </div>
        
        <div style="width:100%; flex: 0 0 auto; display:flex; justify-content:space-between; background:#111111; padding:10px 30px; border-bottom: 1px solid #ffffff; box-sizing:border-box; z-index:2; position:relative;">
            <span id="blog-modal-title" style="color:#ffffff; font-family:'Monaco', 'Menlo', 'Consolas', monospace; font-size:15px; font-weight:normal;">blog-yazisi.md</span>
            <span id="blog-modal-close" style="color:#ffffff; cursor:pointer; font-family:'Monaco', 'Menlo', 'Consolas', monospace; font-size:15px; transition:all 0.2s;" onmouseover="this.style.background='#ffffff'; this.style.color='#000000';" onmouseout="this.style.background='transparent'; this.style.color='#ffffff';">[x]</span>
        </div>
        <div id="blog-content" class="markdown-body" style="width:100%; flex: 1 1 auto; background:transparent; overflow-y:auto; padding:40px 8%; box-sizing:border-box; z-index:2; position:relative;"></div>
    </div>
        </div>
    </div>
    <script>
    window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            const preloader = document.getElementById('preloader');
            preloader.classList.add('shrink');
            setTimeout(function() {
                preloader.style.display = 'none';
                document.getElementById('main-content').style.display = '';
            }, 500);
        }, 3000);
    });
    const terminal = document.getElementById('draggable-terminal');
    const topbar = document.getElementById('terminal-topbar');
    let isFullscreen = false;
    topbar.addEventListener('dblclick', function(e) {
        e.preventDefault();
        toggleFullscreen();
    });
    function toggleFullscreen() {
        if (isFullscreen) {
            terminal.classList.add('shrink');
            isFullscreen = false;
        } else {
            terminal.classList.remove('shrink');
            isFullscreen = true;
        }
    }
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && isFullscreen) {
            toggleFullscreen();
        }
    });
    const ardaText = 'ARDA UÇDU';
    let ardaIndex = 0;
    let ardaDone = false;
    document.addEventListener('keydown', function(e) {
        if (ardaDone) return;
        const komutSpan = document.getElementById('arda-komut');
        if (e.key === 'Enter') {
            ardaDone = true;
            return;
        }
        if (ardaIndex < ardaText.length) {
            komutSpan.textContent += ardaText[ardaIndex];
            ardaIndex++;
        }
        if (ardaIndex > 3 && ardaIndex < ardaText.length) {
            komutSpan.textContent = ardaText;
            ardaDone = true;
        }
        if (ardaIndex === ardaText.length) {
            ardaDone = true;
        }
    });
    const GITHUB_REPO = 'ardaucdu/myws'; 
    const blogContainer = document.getElementById('blog-list-container');
    const blogModal = document.getElementById('blog-modal');
    const blogContent = document.getElementById('blog-content');
    const blogModalClose = document.getElementById('blog-modal-close');
    const blogModalTitle = document.getElementById('blog-modal-title');
    async function openBlog(url, filename) {
        blogModalTitle.textContent = filename;
        blogModal.style.display = 'flex';
        blogContent.innerHTML = '<i>Yükleniyor...</i>';
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("Dosya okunamadı.");
            const mdText = await response.text();
            const rawHtml = marked.parse(mdText);
            blogContent.innerHTML = DOMPurify.sanitize(rawHtml);
        } catch(e) {
            blogContent.innerHTML = '<span style="color:#ff5555;">Hata: Blog yazısı yüklenemedi.</span>';
        }
    }
    blogModalClose.addEventListener('click', () => {
        blogModal.style.display = 'none';
        blogContent.innerHTML = '';
    });
    async function loadBlogs() {
        try {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/blogs`);
            if (!response.ok) {
                throw new Error("GitHub API okunamadı (yerel çalışıyorsanız normaldir)");
            }
            const data = await response.json();
            const mdFiles = data.filter(file => file.name.endsWith('.md'));
            if (mdFiles.length === 0) {
                blogContainer.innerHTML = 'Hiç blog yazısı (.md) bulunamadı.';
                return;
            }
            let htmlList = 'total ' + mdFiles.length + '\n';
            mdFiles.forEach(file => {
                const date = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
                const safeUrl = encodeURI(file.download_url);
                const safeName = file.name.replace(/[<>"'&]/g, c => ({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'})[c]);
                htmlList += `-rw-r--r-- 1 root root  ----- ${date} <a href="#" class="blog-link" data-url="${safeUrl}" data-name="${safeName}" style="color:#3daee9;text-decoration:underline;cursor:pointer;">${safeName}</a>\n`;
            });
            blogContainer.innerHTML = htmlList;
            blogContainer.addEventListener('click', function(e) {
                const link = e.target.closest('.blog-link');
                if (link) {
                    e.preventDefault();
                    openBlog(decodeURI(link.dataset.url), link.dataset.name);
                }
            });
        } catch (error) {
            console.warn(error.message);
            blogContainer.innerHTML = `total 1
-rw-r--r-- 1 root root  12345 Local Test <a href="#" class="blog-link" data-url="blogs/ornek-blog.md" data-name="ornek-blog.md" style="color:#3daee9;text-decoration:underline;cursor:pointer;">ornek-blog.md</a>`;
            blogContainer.addEventListener('click', function(e) {
                const link = e.target.closest('.blog-link');
                if (link) {
                    e.preventDefault();
                    openBlog(decodeURI(link.dataset.url), link.dataset.name);
                }
            });
        }
    }
    loadBlogs();
    </script>
</body>
</html>
